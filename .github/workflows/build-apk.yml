name: Build Makhzani APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o Makhzani-Android-Project.zip -d extracted

      - name: Build APK
        run: gradle -p extracted assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Makhzani-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
